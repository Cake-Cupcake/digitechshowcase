<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yaray & Max - 3D Showcase</title>

    <!-- Loads the 3D viewer component from Google's CDN -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

    <style>
        :root {
            --cream: #fff7ec;
            --butter: #fde9b8;
            --caramel: #c98a4b;
            --cocoa: #4a2c1d;
            --cocoa-soft: #7a5a47;
            --strawberry: #ff6666;
            --card: #fffdf8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--cream);
            color: var(--cocoa);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 4rem;
            background-color: var(--strawberry);
            border-bottom: 4px solid var(--butter);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 6px 16px -8px rgba(74, 44, 29, 0.4);
        }

        .logo {
            font-family: Georgia, "Times New Roman", serif;
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .tag {
            color: var(--cocoa);
            font-size: 0.8rem;
            font-weight: 700;
            background: var(--butter);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }

        /* Intro */
        .intro-section {
            text-align: center;
            padding: 4rem 2rem 2rem 2rem;
            max-width: 760px;
            margin: 0 auto;
        }

        .intro-section h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 3rem;
            color: var(--cocoa);
            margin-bottom: 1rem;
            line-height: 1.15;
        }

        .intro-section p {
            color: var(--cocoa-soft);
            font-size: 1.1rem;
        }

        /* Two-column layout */
        .split-showcase {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
            padding: 2rem 4rem 6rem 4rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .asset-card {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            background: var(--card);
            border: 2px solid var(--butter);
            border-radius: 24px;
            padding: 1.8rem;
            box-shadow: 0 14px 30px -18px rgba(74, 44, 29, 0.35);
        }

        .asset-meta h2 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.9rem;
            color: var(--cocoa);
            margin-bottom: 0.2rem;
        }

        .credit {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--caramel);
        }

        /* 3D viewer */
        .viewer-studio {
            width: 100%;
            height: 480px;
            background: radial-gradient(circle, #fff3dc 0%, #f6d9a8 100%);
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid var(--butter);
            position: relative;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            outline: none;
            --poster-color: transparent;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2.5rem;
            color: var(--butter);
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            background-color: var(--cocoa);
            border-top: 4px solid var(--caramel);
        }

        @media (max-width: 1024px) {
            header { padding: 1rem 1.5rem; }
            .split-showcase { grid-template-columns: 1fr; padding: 1rem 1.5rem 4rem 1.5rem; }
            .viewer-studio { height: 380px; }
            .intro-section h1 { font-size: 2.3rem; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">YARAY + MAX</div>
        <div class="tag">Y10 DIGITAL TECHNOLOGY 2026</div>
    </header>

    <!-- Intro -->
    <section class="intro-section">
        <h1>3D Showcase</h1>
        <p>Two 3D models made in Blender that you can rotate and zoom in on.</p>
    </section>

    <!-- Models -->
    <main class="split-showcase">

        <!-- Cake -->
        <article class="asset-card">
            <div class="asset-meta">
                <h2>The Cake</h2>
                <p class="credit">Modelled by Yaray Hao</p>
            </div>
            <div class="viewer-studio">
                <model-viewer src="DigitechcakeYarayHao.glb"
                              alt="Interactive 3D model of a cake"
                              auto-rotate
                              camera-controls
                              orbit-sensitivity="0.4"
                              zoom-sensitivity="0.5"
                              shadow-intensity="1.8"
                              shadow-softness="0.3"
                              exposure="1.1"
                              environment-image="neutral">
                </model-viewer>
            </div>
        </article>

        <!-- Cupcake -->
        <article class="asset-card">
            <div class="asset-meta">
                <h2>The Cupcake</h2>
                <p class="credit">Modelled by Max Song</p>
            </div>
            <div class="viewer-studio">
                <model-viewer src="DigitechCupcakeMaxSong.glb"
                              alt="Interactive 3D model of a cupcake"
                              auto-rotate
                              camera-controls
                              orbit-sensitivity="0.4"
                              zoom-sensitivity="0.5"
                              shadow-intensity="1.8"
                              shadow-softness="0.3"
                              exposure="1.1"
                              environment-image="neutral">
                </model-viewer>
            </div>
        </article>

    </main> 

    <!-- Footer -->
    <footer>
        <p>Y10 Digital Technology 2026</p>
    </footer>

</body>
</html>
